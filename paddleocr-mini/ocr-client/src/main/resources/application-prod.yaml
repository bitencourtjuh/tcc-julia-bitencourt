
spring:
  datasource:
    url: ${DB_JDBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: false

server:
  port: ${PORT:8080}

ocr:
  service:
    url: ${OCR_SERVICE_URL}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
