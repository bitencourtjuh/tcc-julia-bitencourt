
spring:
  datasource:
    url: jdbc:h2:file:./data/cartorio_db
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate: 
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  application:
    name: ocr-client
  main:
    web-application-type: servlet
server:
  tomcat:
    connection-timeout: 300000
ocr:
  service:
    url: http://127.0.0.1:8000